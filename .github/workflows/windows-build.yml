name: Windows Build Verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go tests (canonical temp path)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path C:\DDS_CI_Temp -Force | Out-Null
          $env:TEMP = 'C:\DDS_CI_Temp'
          $env:TMP = 'C:\DDS_CI_Temp'
          go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Windows GUI build
        run: go build -trimpath -ldflags="-H windowsgui -s -w" -o DDSSetup.exe ./cmd/dds-installer
